    <title>The Tides of Rodentia | By Olly Davis</title>
    <style>
        :root {
            --deep-sea: #0a192f;
            --sylvan-gold: #d4af37;
            --pitch-black: #050b14;
            --canvas-white: #e6f1ff;
            --parchment: #f4ebd0;
            --parchment-dark: #e0d2b4;
            --wood-light: #5c3a21;
            --wood-dark: #3a2211;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background-color: var(--deep-sea);
            color: var(--canvas-white);
            line-height: 1.6;
            background-image: url('water.gif');
            background-repeat: no-repeat;
            background-position: center center;
            background-attachment: fixed;
            background-size: cover;
            background-blend-mode: overlay;
        }

        /* Navigation */
        .nav {
            display: flex;
            justify-content: center;
            gap: 2rem;
            padding: 1.5rem;
            background: linear-gradient(to bottom, var(--sylvan-gold), #b5952f);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border-bottom: 2px solid #8c7322;
        }

        .nav a {
            color: var(--pitch-black);
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: bold;
            transition: color 0.3s ease, transform 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nav a:hover {
            color: var(--canvas-white);
            transform: translateY(-2px);
        }

        /* Hero Section */
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 4rem 2rem;
            min-height: 80vh;
            position: relative;
        }

        .hero h1 {
            font-size: 3.5rem;
            color: var(--sylvan-gold);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 4px 10px rgba(0,0,0,0.8);
        }

        .hero h2 {
            font-size: 1.5rem;
            font-weight: 400;
            margin-bottom: 1rem;
            font-style: italic;
            color: var(--canvas-white);
        }

        .tagline {
            font-size: 1.25rem;
            max-width: 600px;
            margin: 0 auto 3rem auto;
            color: #a8b2d1;
            font-style: italic;
        }

        /* Cover Image Placeholder */
        .cover-container {
            width: 100%;
            max-width: 350px;
            margin-bottom: 3rem;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.9);
            border: 4px solid var(--sylvan-gold);
            border-radius: 4px;
            position: relative;
        }
        
        .cover-container::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
            pointer-events: none;
        }

        .cover-container img {
            width: 100%;
            display: block;
        }

        #countdown {
            border: 2px dashed var(--sylvan-gold);
            padding: 1rem 2rem;
            background-color: rgba(5, 11, 20, 0.7);
            border-radius: 8px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        }

        /* Logbook Layout (Side-by-Side) */
        .logbook-wrapper {
            max-width: 1200px;
            margin: 4rem auto;
            padding: 2rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            background-color: var(--parchment);
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 40px rgba(139, 115, 85, 0.4);
            position: relative;
            color: #2b1f15;
            border: 8px solid var(--wood-dark);
        }

        /* Logbook Spine Binding Effect */
        .logbook-wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 40px;
            transform: translateX(-50%);
            background: linear-gradient(to right, 
                rgba(0,0,0,0.1) 0%, 
                rgba(0,0,0,0.4) 30%, 
                rgba(0,0,0,0.5) 50%, 
                rgba(0,0,0,0.4) 70%, 
                rgba(0,0,0,0.1) 100%);
            box-shadow: inset 0 0 15px rgba(0,0,0,0.6);
            z-index: 10;
        }

        .synopsis {
            padding: 2rem 3rem;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .english-side {
            border-right: 1px solid rgba(0,0,0,0.2);
            background: linear-gradient(to left, rgba(0,0,0,0.05), transparent);
        }

        .tesahoda-side {
            background: linear-gradient(to right, rgba(0,0,0,0.05), transparent);
        }

        .synopsis h3 {
            font-size: 2.2rem;
            color: #4a3018;
            text-align: center;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid #8a6842;
            padding-bottom: 0.5rem;
            font-family: 'Georgia', serif;
            letter-spacing: 1px;
        }

        .synopsis p {
            margin-bottom: 1.5rem;
            font-size: 1.1rem;
            line-height: 1.7;
            text-align: justify;
        }
        
        .synopsis h2 {
            font-size: 1.5rem;
            color: #4a3018;
            margin: 2rem 0 1rem 0;
            text-align: center;
            border-bottom: 1px dashed #8a6842;
            padding-bottom: 0.5rem;
        }

        /* Buttons Container */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: auto; /* Pushes buttons to the bottom of the column */
            padding-top: 1rem;
        }

        /* Thematic Buttons: Wooden Planks with Brass Nails */
        .cta-button, .cta-button-disabled {
            display: block;
            text-align: center;
            background: linear-gradient(to bottom, var(--wood-light), var(--wood-dark));
            color: var(--sylvan-gold);
            text-decoration: none;
            padding: 1rem 1.5rem;
            font-size: 1.1rem;
            border: 2px solid #241409;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.2), 0 6px 10px rgba(0,0,0,0.6);
            transition: all 0.2s ease;
            position: relative;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
            font-family: 'Arial', sans-serif;
            font-weight: bold;
        }

        /* Brass nails */
        .cta-button::before, .cta-button::after,
        .cta-button-disabled::before, .cta-button-disabled::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 8px;
            height: 8px;
            background: radial-gradient(circle, #fbdc80, #b58d24);
            border-radius: 50%;
            box-shadow: inset -1px -1px 3px rgba(0,0,0,0.8), 1px 1px 2px rgba(255,255,255,0.3);
            transform: translateY(-50%);
        }

        .cta-button::before, .cta-button-disabled::before { left: 10px; }
        .cta-button::after, .cta-button-disabled::after { right: 10px; }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.2), 0 8px 15px rgba(0,0,0,0.8);
            filter: brightness(1.1);
        }

        .cta-button:active {
            transform: translateY(2px);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.8), 0 2px 3px rgba(0,0,0,0.6);
        }

        .cta-button-disabled {
            opacity: 0.6;
            cursor: not-allowed;
            pointer-events: none;
            filter: grayscale(0.5);
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.1), 0 2px 4px rgba(0,0,0,0.6);
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 3rem 2rem;
            background-color: var(--pitch-black);
            font-size: 0.9rem;
            color: #a8b2d1;
            border-top: 2px solid var(--sylvan-gold);
        }

        /* Responsive Design */
        @media (max-width: 992px) {
            .logbook-wrapper {
                grid-template-columns: 1fr;
                max-width: 800px;
                margin: 2rem;
            }
            .logbook-wrapper::before {
                display: none; /* Hide spine on mobile stacked view */
            }
            .english-side {
                border-right: none;
                border-bottom: 3px dashed #8a6842;
                padding-bottom: 3rem;
            }
            .tesahoda-side {
                padding-top: 3rem;
            }
        }

        @media (max-width: 768px) {
            .hero h1 { font-size: 2.2rem; }
            .hero h2 { font-size: 1.2rem; }
            .logbook-wrapper { margin: 1rem; border-width: 4px; }
            .synopsis { padding: 1.5rem; }
        }
    </style>
