<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Y2K Motion Aquarium Lamp</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tone.js for Generative Ambient Lofi & Ocean Sounds -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            /* Beautiful dark room background with a subtle tech grid */
            background-color: #0f172a;
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* Glass / Plastic Screen glare effect */
        .glass-glare {
            background: linear-gradient(105deg, 
                rgba(255,255,255,0) 0%, 
                rgba(255,255,255,0.02) 15%, 
                rgba(255,255,255,0.25) 30%, 
                rgba(255,255,255,0.02) 45%, 
                rgba(255,255,255,0) 100%);
            mix-blend-mode: overlay;
        }

        /* LED Glowing Effect applied to the screen when ON */
        .lamp-on {
            box-shadow: 0 0 60px 20px rgba(0, 212, 255, 0.4), inset 0 0 40px rgba(0, 255, 255, 0.3);
        }
        
        .lamp-off {
            box-shadow: inset 0 0 60px rgba(0,0,0,0.8);
        }

        /* The overlay that dims the tank when powered off */
        .darken-overlay {
            position: absolute;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.85);
            transition: background-color 1.5s ease;
            z-index: 20;
            pointer-events: none;
        }
        .lamp-on .darken-overlay {
            background-color: rgba(0, 0, 0, 0);
        }

        /* Seamless Looping Scroller setup */
        .scroll-container {
            display: flex;
            width: 200%; /* Contains two 50% panels to loop perfectly */
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            will-change: transform;
        }
        
        /* The physical panel size inside the scroll container */
        .panel {
            width: 50%;
            height: 100%;
            flex-shrink: 0;
            position: relative;
        }

        /* Speeds for background (distant) and foreground */
        .scroll-back { animation: scrollLeft 50s linear infinite; }
        .scroll-front { animation: scrollLeft 25s linear infinite; }

        @keyframes scrollLeft {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* Novelty Emoji Fish Styles */
        .emoji-fish {
            position: absolute;
            filter: drop-shadow(4px 6px 5px rgba(0,0,0,0.4));
            transition: transform 0.5s ease-in-out;
        }

        /* Generative Procedural Bubbles */
        .bubble {
            position: absolute;
            bottom: -20px;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.1));
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            animation: floatUp infinite ease-in;
            opacity: 0;
            z-index: 15;
            box-shadow: inset -2px -2px 4px rgba(0, 180, 216, 0.4);
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            15% { opacity: 0.8; }
            80% { opacity: 0.5; }
            100% { transform: translateY(-450px) scale(1.3); opacity: 0; }
        }

        /* Skeuomorphic Button Press effect */
        .btn-press:active {
            transform: translateY(4px);
            box-shadow: inset 0 3px 5px rgba(0,0,0,0.2) !important;
            border-bottom-width: 0px !important;
            margin-top: 4px;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center overflow-hidden relative selection:bg-cyan-500 selection:text-white">

    <!-- Global ambient radial glow for the room -->
    <div class="absolute inset-0 z-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-slate-800/50 via-gray-900/80 to-black pointer-events-none transition-opacity duration-1000" id="room-glow"></div>

    <!-- Main Lamp Structure -->
    <div class="relative z-10 flex flex-col items-center w-full px-4 md:px-8">
        
        <!-- Top Plastic Cap -->
        <div class="w-full max-w-[820px] h-12 md:h-16 bg-gradient-to-b from-zinc-200 via-zinc-400 to-zinc-600 rounded-t-[40px] md:rounded-t-[60px] shadow-lg border-t border-x border-zinc-400 relative z-20 overflow-hidden flex items-end justify-center">
            <!-- Cap Highlights / Gloss -->
            <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white to-transparent opacity-40 translate-x-[-15%] pointer-events-none"></div>
            <!-- Vents (Aesthetic) -->
            <div class="flex gap-4 mb-2 opacity-50">
                <div class="w-12 h-1 bg-zinc-800 rounded-full"></div>
                <div class="w-12 h-1 bg-zinc-800 rounded-full"></div>
                <div class="w-12 h-1 bg-zinc-800 rounded-full"></div>
            </div>
        </div>

        <!-- The Glowing Cylinder Screen -->
        <div id="lamp" class="lamp-off w-full max-w-[800px] h-[280px] md:h-[400px] relative overflow-hidden bg-blue-950 border-x-8 border-zinc-400 z-10 transition-all duration-1000">
            
            <!-- Dark State Overlay -->
            <div class="darken-overlay"></div>

            <!-- Deep Water Base Gradient -->
            <div class="absolute inset-0 bg-gradient-to-b from-cyan-400 via-blue-600 to-blue-900 opacity-90"></div>

            <!-- Sunbeams -->
            <div class="absolute top-0 left-0 w-full h-40 bg-gradient-to-b from-white/30 to-transparent pointer-events-none z-0"></div>

            <!-- Scrolling Layers Wrapper (Injected via JS) -->
            <div class="absolute inset-0" id="scroll-wrapper"></div>

            <!-- Procedural Bubbles Container -->
            <div id="bubbles-container" class="absolute inset-0 pointer-events-none"></div>

            <!-- Inner Shadow to simulate 3D cylinder depth -->
            <div class="absolute inset-0 pointer-events-none shadow-[inset_30px_0_40px_rgba(0,0,0,0.5),inset_-30px_0_40px_rgba(0,0,0,0.5)] z-20"></div>

            <!-- Curved Glass Glare Overlay -->
            <div class="absolute inset-0 pointer-events-none glass-glare z-20"></div>
        </div>

        <!-- Bottom Plastic Base -->
        <div class="w-[102%] max-w-[840px] h-28 md:h-36 bg-gradient-to-t from-zinc-600 via-zinc-300 to-zinc-400 rounded-b-[40px] md:rounded-b-[60px] shadow-[0_25px_50px_rgba(0,0,0,0.9)] border-b border-x border-zinc-400 relative z-20 flex flex-col items-center justify-center border-t-[10px] md:border-t-[15px] border-t-zinc-800">
            
            <!-- Branding Label -->
            <div class="absolute top-3 bg-zinc-300 text-zinc-600 border-b-2 border-r-2 border-t border-l border-zinc-100 border-b-zinc-400 border-r-zinc-400 text-[10px] md:text-xs px-4 py-1 rounded-sm shadow-inner tracking-[0.2em] font-extrabold uppercase mb-2">
                Ocean Motion
            </div>

            <!-- Base Highlights -->
            <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white to-transparent opacity-30 pointer-events-none rounded-b-[60px]"></div>
            
            <!-- Power / Audio Control Button -->
            <button id="toggle-btn" class="mt-4 relative z-30 bg-zinc-200 border-b-4 border-zinc-400 shadow-lg rounded-full px-6 py-2 md:px-8 md:py-3 flex items-center gap-3 hover:bg-white transition-colors text-zinc-800 font-bold text-sm md:text-lg btn-press">
                <i id="play-icon" class="fa-solid fa-power-off text-red-500 transition-colors duration-300"></i>
                <span id="play-btn-text">Power & Lofi</span>
            </button>
        </div>
    </div>

    <!-- Application Logic & Audio Engine -->
    <script>
        // --- 1. VISUAL SETUP: Scrolling Backgrounds ---
        
        // We use JavaScript to populate the panels so we don't have to duplicate massive SVG/HTML blocks.
        // The seamless illusion works by having two identical panels side-by-side that shift exactly one panel width.
        
        const frontPanelHTML = `
            <div class="relative w-full h-full">
                <!-- SVG Vector Scenery (Sand & Corals) -->
                <svg width="100%" height="100%" viewBox="0 0 1000 400" preserveAspectRatio="none" class="absolute inset-0 pointer-events-none">
                    <!-- Base Sand -->
                    <path d="M0 380 Q250 340 500 385 T1000 370 L1000 400 L0 400 Z" fill="#d4a373" opacity="0.95"/>
                    <path d="M0 390 Q250 360 500 395 T1000 380 L1000 400 L0 400 Z" fill="#cc9b6a" opacity="0.95"/>
                    
                    <!-- Left Cluster Seaweed/Coral -->
                    <path d="M50 400 Q30 300 70 180 Q100 250 80 400" fill="#2d6a4f" />
                    <path d="M80 400 Q110 320 90 230 Q60 280 110 400" fill="#40916c" />
                    <path d="M120 400 Q150 350 130 280 Q100 320 150 400" fill="#52b788" />
                    <circle cx="90" cy="380" r="15" fill="#e07a5f" />
                    <circle cx="85" cy="370" r="10" fill="#f4a261" />
                    
                    <!-- Middle Subtle Elements -->
                    <path d="M450 400 Q440 350 460 320 Q480 370 470 400" fill="#2d6a4f" />
                    <polygon points="500,400 510,385 525,395" fill="#f4a261"/>

                    <!-- Right Cluster Seaweed/Coral -->
                    <path d="M850 400 Q830 250 880 150 Q920 250 870 400" fill="#2d6a4f" />
                    <path d="M880 400 Q920 300 890 180 Q850 250 910 400" fill="#40916c" />
                    <path d="M920 400 Q960 320 930 220 Q900 280 950 400" fill="#1b4332" />
                    <circle cx="880" cy="385" r="12" fill="#e76f51" />
                </svg>

                <!-- Novelty Fish (Emojis styled as stickers to mimic old printing) -->
                <!-- Fish face left, swimming against the scroll direction -->
                <div class="emoji-fish" style="top: 20%; left: 15%; font-size: clamp(2.5rem, 5vw, 4.5rem); transform: scaleX(-1);">🐠</div>
                <div class="emoji-fish" style="top: 55%; left: 40%; font-size: clamp(2rem, 4vw, 3.5rem); transform: scaleX(-1);">🐡</div>
                <div class="emoji-fish" style="top: 80%; left: 80%; font-size: clamp(1.5rem, 3vw, 2.5rem);">🦀</div>
                <div class="emoji-fish" style="top: 12%; left: 75%; font-size: clamp(2.5rem, 5vw, 4rem); transform: scaleX(-1);">🐢</div>
                <div class="emoji-fish" style="top: 38%; left: 65%; font-size: clamp(1.8rem, 3.5vw, 3rem); transform: scaleX(-1);">🐟</div>
                <!-- Mini shrimp hidden near sand -->
                <div class="emoji-fish" style="top: 85%; left: 20%; font-size: clamp(1rem, 2vw, 1.5rem); transform: scaleX(-1);">🦐</div>
            </div>
        `;

        const backPanelHTML = `
            <div class="relative w-full h-full opacity-60">
                <!-- Distant blurry fish for parallax depth -->
                <div class="emoji-fish blur-[2px]" style="top: 30%; left: 25%; font-size: clamp(1.5rem, 3vw, 2.5rem); transform: scaleX(-1);">🐬</div>
                <div class="emoji-fish blur-[3px]" style="top: 60%; left: 70%; font-size: clamp(2rem, 4vw, 3rem); transform: scaleX(-1);">🦈</div>
                <div class="emoji-fish blur-[2px]" style="top: 15%; left: 50%; font-size: clamp(1.5rem, 3vw, 2rem); transform: scaleX(-1);">🐠</div>
                <div class="emoji-fish blur-[2px]" style="top: 75%; left: 30%; font-size: clamp(1.2rem, 2vw, 1.8rem); transform: scaleX(-1);">🐟</div>
                
                <!-- Distant Seaweed Silhouettes -->
                <svg width="100%" height="100%" viewBox="0 0 1000 400" preserveAspectRatio="none" class="absolute inset-0 pointer-events-none">
                    <path d="M300 400 Q320 250 280 180 Q250 250 310 400" fill="#03045e" opacity="0.5" />
                    <path d="M600 400 Q580 300 620 220 Q650 280 610 400" fill="#03045e" opacity="0.5" />
                </svg>
            </div>
        `;

        // Inject into the DOM wrapper
        const scrollWrapper = document.getElementById('scroll-wrapper');
        scrollWrapper.innerHTML = `
            <!-- Distant Layer (Slow) -->
            <div class="scroll-container scroll-back">
                <div class="panel">${backPanelHTML}</div>
                <div class="panel">${backPanelHTML}</div>
            </div>
            <!-- Foreground Layer (Fast) -->
            <div class="scroll-container scroll-front">
                <div class="panel">${frontPanelHTML}</div>
                <div class="panel">${frontPanelHTML}</div>
            </div>
        `;

        // --- 2. PROCEDURAL BUBBLE GENERATOR ---
        const bubbleContainer = document.getElementById('bubbles-container');
        let bubbleInterval;

        function createBubble() {
            const bubble = document.createElement('div');
            bubble.classList.add('bubble');
            const size = Math.random() * 12 + 6; // 6px to 18px
            bubble.style.width = `${size}px`;
            bubble.style.height = `${size}px`;
            bubble.style.left = `${Math.random() * 95 + 2}%`; // anywhere horizontally
            bubble.style.animationDuration = `${Math.random() * 2 + 2.5}s`; // 2.5s to 4.5s
            
            bubbleContainer.appendChild(bubble);

            // Cleanup bubble after animation finishes to prevent DOM bloating
            setTimeout(() => {
                if(bubble.parentElement) bubble.remove();
            }, 5000);
        }

        // --- 3. AUDIO ENGINE & STATE LOGIC (Tone.js) ---
        let audioSetup = false;
        let isPlaying = false;
        let lofiPart;
        let oceanNoise;

        async function initAudio() {
            await Tone.start();
            
            // Master Effects Chain for "Underwater" Lofi feel
            const masterCompressor = new Tone.Compressor({ threshold: -24, ratio: 4 }).toDestination();
            const freeverb = new Tone.Freeverb({ roomSize: 0.85, dampening: 2000 }).connect(masterCompressor);

            // 3.1 Ocean Wave Synthesizer (Pink Noise + Sweeping Filter)
            oceanNoise = new Tone.Noise("pink");
            const oceanFilter = new Tone.AutoFilter({
                frequency: "6m",    // Very slow sweep
                min: 150,
                max: 700,
                type: "sine",
                depth: 1
            }).connect(freeverb).start();
            oceanNoise.connect(oceanFilter);
            oceanNoise.volume.value = -22; // Subtle background ambience

            // 3.2 Lofi Pad Synth
            const padSynth = new Tone.PolySynth(Tone.Synth, {
                oscillator: { type: "triangle" },
                envelope: { attack: 2, decay: 2, sustain: 0.6, release: 6 }
            }).connect(freeverb);
            padSynth.volume.value = -16;

            // 3.3 Delicate Pluck/Arp Synth
            const arpSynth = new Tone.Synth({
                oscillator: { type: "sine" },
                envelope: { attack: 0.05, decay: 0.4, sustain: 0.1, release: 2 }
            }).connect(freeverb);
            arpSynth.volume.value = -18;

            // Nostalgic, relaxing chord progression (Y2K / Frutiger Aero vibes)
            // CMaj9 -> Am9 -> FMaj9 -> G13
            const chords = [
                ["C3", "E3", "G3", "B3", "D4"],
                ["A2", "C3", "E3", "G3", "B3"],
                ["F2", "A2", "C3", "E3", "G3"],
                ["G2", "B2", "D3", "F3", "A3"]
            ];
            
            let measure = 0;
            
            // The Generative Music Loop
            lofiPart = new Tone.Loop((time) => {
                const currentChord = chords[measure % chords.length];
                
                // Play soft pad chord
                padSynth.triggerAttackRelease(currentChord, "2m", time);
                
                // Play a couple of gentle random arp notes from the chord to add sparkle
                const note1 = currentChord[Math.floor(Math.random() * currentChord.length)];
                const note2 = currentChord[Math.floor(Math.random() * currentChord.length)];
                arpSynth.triggerAttackRelease(note1, "8n", time + 1.2);
                arpSynth.triggerAttackRelease(note2, "4n", time + 2.8);

                measure++;
            }, "2m");

            Tone.Transport.bpm.value = 65; // Slow, relaxing tempo
            audioSetup = true;
        }

        async function toggleLamp() {
            const lamp = document.getElementById('lamp');
            const playIcon = document.getElementById('play-icon');
            const playText = document.getElementById('play-btn-text');
            const roomGlow = document.getElementById('room-glow');

            if (!audioSetup) {
                // Must be initialized on first user click to satisfy browser audio policies
                await initAudio();
            }

            if (!isPlaying) {
                // Turn ON
                if (Tone.context.state !== 'running') await Tone.context.resume();
                Tone.Transport.start();
                if(lofiPart) lofiPart.start(0);
                if(oceanNoise) oceanNoise.start();

                // UI Updates
                lamp.classList.add('lamp-on');
                lamp.classList.remove('lamp-off');
                roomGlow.classList.remove('opacity-0');
                
                playText.innerText = "Power Off";
                playIcon.classList.replace('text-red-500', 'text-green-500');
                
                // Start physical bubbles
                bubbleInterval = setInterval(createBubble, 400);
                
                isPlaying = true;
            } else {
                // Turn OFF
                Tone.Transport.pause();
                if(lofiPart) lofiPart.stop();
                if(oceanNoise) oceanNoise.stop();

                // UI Updates
                lamp.classList.remove('lamp-on');
                lamp.classList.add('lamp-off');
                roomGlow.classList.add('opacity-0');

                playText.innerText = "Power & Lofi";
                playIcon.classList.replace('text-green-500', 'text-red-500');
                
                // Stop bubbles
                clearInterval(bubbleInterval);
                
                isPlaying = false;
            }
        }

        // Event Listener
        document.getElementById('toggle-btn').addEventListener('click', toggleLamp);

    </script>
</body>
</html>
